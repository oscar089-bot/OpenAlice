services:
  tv-fetcher:
    build: .
    ports:
      - "8081:8081"  # WebSocket API
      - "8082:8082"  # Health API
      - "9100:9100"  # Prometheus metrics
    environment:
      - TV_API_PROXY=
      - TV_API_TIMEOUT_MS=10000
      - WEBSOCKET_PORT=8081
      - WEBSOCKET_ENABLED=true
      - METRICS_PORT=9100
      - HEALTH_API_PORT=8082
      - LOG_LEVEL=info
      - LOG_FILE=/app/logs/tv-fetcher.log
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped 